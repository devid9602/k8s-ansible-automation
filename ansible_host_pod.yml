apiVersion: v1
kind: Pod
metadata:
  name: ansible-host-2
  labels:
    app: ansible-host-2
spec:
  containers:
  - name: ansible-container
    image: ubuntu:22.04
    command: ["/bin/bash", "-c"]
    args:
      - |
        apt update &&
        apt install -y openssh-server python3 sudo &&
        useradd -m ansible &&
        : "${ANSIBLE_PASSWORD:?Provide ANSIBLE_PASSWORD through a Kubernetes Secret}" && printf 'ansible:%s
' "$ANSIBLE_PASSWORD" | chpasswd &&
        echo "ansible ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers &&
        mkdir /var/run/sshd &&
        /usr/sbin/sshd -D
    ports:
      - containerPort: 22
    securityContext:
      runAsUser: 0
      privileged: true
---
apiVersion: v1
kind: Service
metadata:
  name: ansible-host-2-svc
spec:
  type: NodePort
  selector:
    app: ansible-host-2
  ports:
    - port: 22
      targetPort: 22
      nodePort: 32223   # Adjust if needed; this is the external port

